name: regenerate docs
# Started by hand. Regenerates docs/ from SANKHYA main and opens a PR if anything changed.
# It never commits to main and never deploys; merging the PR is a person's decision.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thegoodengineers/SANKHYA
          ref: main
          path: solver
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-docs.txt
      - name: generate
        id: gen
        run: |
          python tools/build_docs.py --solver solver
          python tools/facts.py --check
          echo "commit=$(git -C solver rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf solver
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/regenerate
          base: main
          add-paths: docs/
          commit-message: "docs: regenerate from SANKHYA ${{ steps.gen.outputs.commit }}"
          title: "docs: regenerate from SANKHYA ${{ steps.gen.outputs.commit }}"
          body: "Generated by tools/build_docs.py from SANKHYA main at ${{ steps.gen.outputs.commit }}. The generator checked every link, every table's row count and every number against its source before writing."
          delete-branch: true
